<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Bingo Card Generator</title>
<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2540;
    --panel: #ffffff;
    --line: #e4d9c3;
    --accent: #ff6b6b;
    --c1: #ffd6d6; --c2: #ffe8c2; --c3: #fff6b8;
    --c4: #cdf0d0; --c5: #cfe6ff; --c6: #e6d4ff;
    --cardW: 170mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  .controls {
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 16px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    margin-bottom: 20px;
  }
  .controls .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 4px; font-weight: 700; font-size: .85rem; }
  input[type=text], input[type=number], select {
    font: inherit; font-weight: 400; padding: 8px 10px; border: 2px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); width: 100%;
  }
  input:disabled { background: #f3efe6; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 12px;
    border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #4d8dff; outline-offset: 2px; }

  /* ---- cards ---- */
  .sheets { display: grid; gap: 20px; justify-items: center; }
  .sheet { background: #fff; border: 1px dashed var(--line); padding: 10px; }
  .slot { display: flex; align-items: center; justify-content: center; }
  .card {
    width: var(--cardW); border: 4px solid var(--ink); border-radius: 18px;
    padding: 4mm; background: #fff;
  }
  .card h2 {
    margin: 0 0 3mm; text-align: center; font-size: 8mm; line-height: 1.1;
    min-height: 9mm; overflow-wrap: anywhere;
  }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2mm; }
  .cell {
    aspect-ratio: 1; display: grid; place-items: center;
    border: 2px solid var(--ink); border-radius: 3mm;
    font-weight: 800; font-size: calc(var(--cardW) / 7); line-height: 1;
    background: #fff; overflow: hidden; text-align: center;
  }
  .colored .n1 { background: var(--c1); } .colored .n2 { background: var(--c2); }
  .colored .n3 { background: var(--c3); } .colored .n4 { background: var(--c4); }
  .colored .n5 { background: var(--c5); } .colored .n6 { background: var(--c6); }
  .cell.center { background: #f2f2f2; border-width: 3px; }
  .colored .cell.center { background: #fff1b3; }

  /* ---- print ---- */
  .sheet.blank { display: none; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .app { padding: 0; max-width: none; }
    .sheets { display: block; }
    .sheet.blank { display: block; }
    .sheet { border: 0; padding: 0; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="app">
  <div class="no-print">
    <h1>🎲 Kids Bingo Card Generator</h1>
    <p>5×5 cards with random numbers from 1 to 6. Perfect for a dice game!</p>

    <div class="controls">
      <label class="wide">Header (top of every card)
        <input type="text" id="header" value="BINGO!" maxlength="40">
      </label>

      <label>Middle field
        <select id="centerType">
          <option value="star">★ Star</option>
          <option value="heart">❤ Heart</option>
          <option value="smile">😀 Smiley</option>
          <option value="free">FREE</option>
          <option value="custom">Custom text / emoji…</option>
        </select>
      </label>
      <label>Custom middle text
        <input type="text" id="centerText" value="" maxlength="6" placeholder="e.g. 🦄 or Joker" disabled>
      </label>

      <label>Number of cards
        <input type="number" id="count" value="4" min="1" max="60">
      </label>

      <label>Print layout
        <select id="layout">
          <option value="1">1 card per page</option>
          <option value="2">2 cards per page (landscape, side by side)</option>
        </select>
      </label>
      <label>Paper size
        <select id="paper">
          <option value="A4">A4</option>
          <option value="Letter">US Letter</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="colored" checked> Colored cells (turn off to save ink)</label>

      <label class="check"><input type="checkbox" id="blank"> Blank page after each sheet (for duplex printing)</label>

      <div class="actions wide">
        <button class="primary" id="generate">🎲 Generate new cards</button>
        <button id="print">🖨 Print</button>
      </div>
    </div>
  </div>

  <div class="sheets" id="sheets" aria-live="polite"></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const CENTER = { star: '★', heart: '❤', smile: '😀', free: 'FREE' };
  let cards = [];   // array of 25-number arrays (index 12 unused)

  function randomCard() {
    return Array.from({ length: 25 }, () => 1 + Math.floor(Math.random() * 6));
  }

  function generate() {
    const n = Math.max(1, Math.min(60, parseInt($('count').value, 10) || 1));
    $('count').value = n;
    cards = Array.from({ length: n }, randomCard);
    render();
  }

  function centerValue() {
    const t = $('centerType').value;
    if (t === 'custom') return $('centerText').value.trim() || '★';
    return CENTER[t];
  }

  function cardEl(nums) {
    const card = document.createElement('div');
    card.className = 'card';
    const h = document.createElement('h2');
    h.textContent = $('header').value;
    card.appendChild(h);
    const g = document.createElement('div');
    g.className = 'grid';
    nums.forEach((v, i) => {
      const c = document.createElement('div');
      if (i === 12) {
        c.className = 'cell center';
        const val = centerValue();
        c.textContent = val;
        if (val.length > 2) c.style.fontSize = `calc(var(--cardW) / ${val.length > 4 ? 14 : 10})`;
      } else {
        c.className = 'cell n' + v;
        c.textContent = v;
      }
      g.appendChild(c);
    });
    card.appendChild(g);
    return card;
  }

  function render() {
    const per = $('layout').value === '2' ? 2 : 1;
    const paper = $('paper').value;
    // 2-up: landscape page (portrait turned 90 degrees), two cards side by side.
    const cardW = per === 2 ? (paper === 'A4' ? '125mm' : '120mm') : (paper === 'A4' ? '170mm' : '165mm');
    document.documentElement.style.setProperty('--cardW', cardW);
    $('sheets').classList.toggle('colored', $('colored').checked);

    const P = paper === 'A4' ? { w: 210, h: 297 } : { w: 215.9, h: 279.4 };
    const margin = 10;
    const pw = per === 2 ? P.h : P.w, ph = per === 2 ? P.w : P.h;
    // Sheet is 2mm shorter than the printable area so it never spills onto an extra page.
    document.getElementById('pageStyle').textContent =
      `@page { size: ${paper} ${per === 2 ? 'landscape' : 'portrait'}; margin: ${margin}mm; }
       .sheet { width: ${pw - 2 * margin}mm; height: ${ph - 2 * margin - 2}mm; overflow: hidden; display: flex; }
       .slot { flex: 1 1 0; min-width: 0; height: 100%; }`;

    const root = $('sheets');
    root.innerHTML = '';
    for (let i = 0; i < cards.length; i += per) {
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      for (let j = i; j < Math.min(i + per, cards.length); j++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.appendChild(cardEl(cards[j]));
        sheet.appendChild(slot);
      }
      root.appendChild(sheet);
      if ($('blank').checked && i + per < cards.length) {
        const b = document.createElement('div');
        b.className = 'sheet blank';
        root.appendChild(b);
      }
    }
  }

  $('centerType').addEventListener('change', () => {
    $('centerText').disabled = $('centerType').value !== 'custom';
    if (!$('centerText').disabled) $('centerText').focus();
    render();
  });
  ['header', 'centerText', 'layout', 'paper', 'colored', 'blank'].forEach(id =>
    $(id).addEventListener('input', render));
  $('count').addEventListener('change', () => {
    const n = Math.max(1, Math.min(60, parseInt($('count').value, 10) || 1));
    $('count').value = n;
    while (cards.length < n) cards.push(randomCard());
    cards.length = n;
    render();
  });
  $('generate').addEventListener('click', generate);
  $('print').addEventListener('click', () => window.print());

  generate();
})();
</script>
</body>
</html>
