<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinder-Bingo-Karten-Generator</title>
<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2540;
    --panel: #ffffff;
    --line: #e4d9c3;
    --accent: #ff6b6b;
    --c1: #ffd6d6; --c2: #ffe8c2; --c3: #fff6b8;
    --c4: #cdf0d0; --c5: #cfe6ff; --c6: #e6d4ff;
    --cardW: 170mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  html { font-size: 20px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  .controls {
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 16px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    margin-bottom: 20px;
  }
  .controls .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 1rem; }
  input[type=text], input[type=number], select {
    font: inherit; font-weight: 400; padding: 12px 12px; min-height: 48px; border: 2px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); width: 100%;
  }
  input:disabled { background: #f3efe6; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { display: flex; gap: 0; flex-shrink: 0; }
  .lang button { padding: 8px 16px; min-height: 48px; border-radius: 0; font-size: 1rem; }
  .lang button:first-child { border-radius: 10px 0 0 10px; }
  .lang button:last-child { border-radius: 0 10px 10px 0; border-left: 0; }
  .lang button[aria-pressed=true] { background: var(--ink); color: #fff; }
  .steps { display: grid; gap: 18px; margin-bottom: 14px; }
  .step { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px; }
  .step h3 { margin: 0 0 10px; font-size: 1.2rem; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 56px; padding: 0; font-size: 1.8rem; line-height: 1; }
  .stepper input { width: 90px; text-align: center; font-size: 1.6rem; font-weight: 700; }
  .big { font-size: 1.3rem; width: 100%; padding: 18px; }
  details.more { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; margin-bottom: 20px; }
  details.more summary { cursor: pointer; padding: 16px; font-weight: 700; font-size: 1.1rem; }
  details.more .controls { border: 0; margin: 0; border-top: 2px solid var(--line); border-radius: 0 0 16px 16px; }
  .check input { width: 26px; height: 26px; flex-shrink: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; padding: 14px 22px; min-height: 52px; border-radius: 12px;
    border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #4d8dff; outline-offset: 2px; }

  /* ---- cards ---- */
  .sheets { display: grid; gap: 20px; justify-items: center; }
  .sheet { background: #fff; border: 1px dashed var(--line); padding: 10px; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .sheets { width: 100%; }
  .slot { width: min(var(--cardW), 100%); display: flex; align-items: center; justify-content: center; }
  .card {
    width: min(var(--cardW), 100%); container-type: inline-size; border: 4px solid var(--ink); border-radius: 18px;
    padding: 4mm; background: #fff;
  }
  .card h2 {
    margin: 0 0 3mm; text-align: center; font-size: 8mm; line-height: 1.1;
    min-height: 9mm; overflow-wrap: anywhere;
  }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2mm; }
  .cell {
    aspect-ratio: 1; display: grid; place-items: center;
    border: 2px solid var(--ink); border-radius: 3mm;
    font-weight: 800; font-size: calc(100cqw / var(--cdiv, 7)); line-height: 1;
    background: #fff; overflow: hidden; text-align: center;
  }
  .colored .n1 { background: var(--c1); } .colored .n2 { background: var(--c2); }
  .colored .n3 { background: var(--c3); } .colored .n4 { background: var(--c4); }
  .colored .n5 { background: var(--c5); } .colored .n6 { background: var(--c6); }
  .cell.center { background: #f2f2f2; border-width: 3px; }
  .colored .cell.center { background: #fff1b3; }

  /* ---- print ---- */
  .sheet.blank { display: none; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .app { padding: 0; max-width: none; }
    .sheets { display: block; }
    .cell { font-size: calc(var(--cardW) / var(--cdiv, 7)); }
    .sheet.blank { display: block; }
    .sheet { border: 0; padding: 0; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="app">
  <div class="no-print">
    <div class="topbar">
      <h1>🎲 <span data-i18n="title"></span></h1>
      <div class="lang" role="group" aria-label="Language / Sprache">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <p data-i18n="intro"></p>

    <div class="steps">
      <div class="step">
        <h3>1. <span data-i18n="step1"></span></h3>
        <div class="stepper">
          <button type="button" id="minus" aria-label="−1">−</button>
          <input type="number" id="count" value="4" min="1" max="60" aria-label="" data-i18n-aria="count">
          <button type="button" id="plus" aria-label="+1">+</button>
        </div>
      </div>
      <div class="step">
        <h3>2. <span data-i18n="step2"></span></h3>
        <button class="primary big" id="print">🖨 <span data-i18n="print"></span></button>
      </div>
      <button type="button" id="generate">🎲 <span data-i18n="generate"></span></button>
    </div>

    <details class="more">
      <summary data-i18n="more"></summary>
      <div class="controls">
      <label class="wide"><span data-i18n="header"></span>
        <input type="text" id="header" value="BINGO!" maxlength="40">
      </label>

      <label><span data-i18n="middle"></span>
        <select id="centerType">
          <option value="star" data-i18n="optStar"></option>
          <option value="heart" data-i18n="optHeart"></option>
          <option value="smile" data-i18n="optSmile"></option>
          <option value="free" data-i18n="optFree"></option>
          <option value="custom" data-i18n="optCustom"></option>
        </select>
      </label>
      <label><span data-i18n="customText"></span>
        <input type="text" id="centerText" value="" maxlength="6" data-i18n-placeholder="customPh" disabled>
      </label>

      <label><span data-i18n="layout"></span>
        <select id="layout">
          <option value="1" data-i18n="layout1"></option>
          <option value="2" data-i18n="layout2"></option>
        </select>
      </label>
      <label><span data-i18n="paper"></span>
        <select id="paper">
          <option value="A4">A4</option>
          <option value="Letter" data-i18n="letter"></option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="colored" checked> <span data-i18n="colored"></span></label>

      <label class="check"><input type="checkbox" id="blank"> <span data-i18n="blank"></span></label>

      </div>
    </details>
  </div>

  <div class="sheets" id="sheets" aria-live="polite"></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const I18N = {
    de: {
      pageTitle: 'Kinder-Bingo-Karten-Generator',
      title: 'Kinder-Bingo-Karten-Generator',
      step1: 'Wie viele Karten?',
      step2: 'Fertig? Dann ausdrucken:',
      more: '⚙ Weitere Einstellungen (Überschrift, Mittelfeld, Papier …)',
      intro: '5×5-Karten mit Zufallszahlen von 1 bis 6. Perfekt für ein Würfelspiel!',
      header: 'Überschrift (oben auf jeder Karte)',
      middle: 'Mittelfeld',
      optStar: '★ Stern', optHeart: '❤ Herz', optSmile: '😀 Smiley', optFree: 'FREI',
      optCustom: 'Eigener Text / Emoji…',
      customText: 'Eigener Text im Mittelfeld',
      customPh: 'z. B. 🦄 oder Joker',
      count: 'Anzahl der Karten',
      layout: 'Druck-Layout',
      layout1: '1 Karte pro Seite',
      layout2: '2 Karten pro Seite (Querformat, nebeneinander)',
      paper: 'Papierformat',
      letter: 'US Letter',
      colored: 'Farbige Felder (zum Tintesparen ausschalten)',
      blank: 'Leere Seite nach jedem Blatt (für Duplexdruck)',
      generate: 'Andere Zahlen würfeln (neue Karten)',
      print: 'Drucken',
      free: 'FREI'
    },
    en: {
      pageTitle: 'Kids Bingo Card Generator',
      title: 'Kids Bingo Card Generator',
      step1: 'How many cards?',
      step2: 'Ready? Print them:',
      more: '⚙ More settings (header, middle field, paper …)',
      intro: '5×5 cards with random numbers from 1 to 6. Perfect for a dice game!',
      header: 'Header (top of every card)',
      middle: 'Middle field',
      optStar: '★ Star', optHeart: '❤ Heart', optSmile: '😀 Smiley', optFree: 'FREE',
      optCustom: 'Custom text / emoji…',
      customText: 'Custom middle text',
      customPh: 'e.g. 🦄 or Joker',
      count: 'Number of cards',
      layout: 'Print layout',
      layout1: '1 card per page',
      layout2: '2 cards per page (landscape, side by side)',
      paper: 'Paper size',
      letter: 'US Letter',
      colored: 'Colored cells (turn off to save ink)',
      blank: 'Blank page after each sheet (for duplex printing)',
      generate: 'Roll different numbers (new cards)',
      print: 'Print',
      free: 'FREE'
    }
  };
  let lang = 'de';
  try { if (localStorage.getItem('lang') === 'en') lang = 'en'; } catch (e) {}
  const t = k => I18N[lang][k];

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('pageTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll('.lang button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }

  const CENTER = { star: '★', heart: '❤', smile: '😀' };
  let cards = [];   // array of 25-number arrays (index 12 unused)

  function randomCard() {
    return Array.from({ length: 25 }, () => 1 + Math.floor(Math.random() * 6));
  }

  function generate() {
    const n = Math.max(1, Math.min(60, parseInt($('count').value, 10) || 1));
    $('count').value = n;
    cards = Array.from({ length: n }, randomCard);
    render();
  }

  function centerValue() {
    const t = $('centerType').value;
    if (t === 'custom') return $('centerText').value.trim() || '★';
    return t === 'free' ? I18N[lang].free : CENTER[t];
  }

  function cardEl(nums) {
    const card = document.createElement('div');
    card.className = 'card';
    const h = document.createElement('h2');
    h.textContent = $('header').value;
    card.appendChild(h);
    const g = document.createElement('div');
    g.className = 'grid';
    nums.forEach((v, i) => {
      const c = document.createElement('div');
      if (i === 12) {
        c.className = 'cell center';
        const val = centerValue();
        c.textContent = val;
        if (val.length > 2) c.style.setProperty('--cdiv', val.length > 4 ? 14 : 10);
      } else {
        c.className = 'cell n' + v;
        c.textContent = v;
      }
      g.appendChild(c);
    });
    card.appendChild(g);
    return card;
  }

  function render() {
    const per = $('layout').value === '2' ? 2 : 1;
    const paper = $('paper').value;
    // 2-up: landscape page (portrait turned 90 degrees), two cards side by side.
    const cardW = per === 2 ? (paper === 'A4' ? '125mm' : '120mm') : (paper === 'A4' ? '170mm' : '165mm');
    document.documentElement.style.setProperty('--cardW', cardW);
    $('sheets').classList.toggle('colored', $('colored').checked);

    const P = paper === 'A4' ? { w: 210, h: 297 } : { w: 215.9, h: 279.4 };
    const margin = 10;
    const pw = per === 2 ? P.h : P.w, ph = per === 2 ? P.w : P.h;
    // Sheet is 2mm shorter than the printable area so it never spills onto an extra page.
    document.getElementById('pageStyle').textContent =
      `@page { size: ${paper} ${per === 2 ? 'landscape' : 'portrait'}; margin: ${margin}mm; }
       @media print {
         .sheet { width: ${pw - 2 * margin}mm; height: ${ph - 2 * margin - 2}mm; overflow: hidden; display: flex; flex-wrap: nowrap; gap: 0; }
         .slot { flex: 1 1 0; min-width: 0; height: 100%; }
       }`;

    const root = $('sheets');
    root.innerHTML = '';
    for (let i = 0; i < cards.length; i += per) {
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      for (let j = i; j < Math.min(i + per, cards.length); j++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.appendChild(cardEl(cards[j]));
        sheet.appendChild(slot);
      }
      root.appendChild(sheet);
      if ($('blank').checked && i + per < cards.length) {
        const b = document.createElement('div');
        b.className = 'sheet blank';
        root.appendChild(b);
      }
    }
  }

  $('centerType').addEventListener('change', () => {
    $('centerText').disabled = $('centerType').value !== 'custom';
    if (!$('centerText').disabled) $('centerText').focus();
    render();
  });
  ['header', 'centerText', 'layout', 'paper', 'colored', 'blank'].forEach(id =>
    $(id).addEventListener('input', render));
  $('count').addEventListener('change', () => {
    const n = Math.max(1, Math.min(60, parseInt($('count').value, 10) || 1));
    $('count').value = n;
    while (cards.length < n) cards.push(randomCard());
    cards.length = n;
    render();
  });
  function step(d) {
    $('count').value = Math.max(1, Math.min(60, (parseInt($('count').value, 10) || 1) + d));
    $('count').dispatchEvent(new Event('change'));
  }
  $('minus').addEventListener('click', () => step(-1));
  $('plus').addEventListener('click', () => step(1));
  $('generate').addEventListener('click', generate);
  $('print').addEventListener('click', () => window.print());

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    applyLang();
    render();
  }));

  applyLang();
  generate();
})();
</script>
</body>
</html>
